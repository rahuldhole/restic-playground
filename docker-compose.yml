services:
  restic:
    image: restic/restic:latest
    container_name: restic-playground
    volumes:
      - ./data:/data:rw
      - ./logs:/logs
      - ./scripts:/scripts:ro
      - ./scenarios:/scenarios:ro
    environment:
      - RESTIC_REPOSITORY=s3:http://minio:9000/playground
      - RESTIC_PASSWORD=playground-password
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    depends_on:
      minio-init:
        condition: service_completed_successfully
    entrypoint: ["/usr/bin/tail", "-f", "/dev/null"]

  backrest:
    image: garethgeorge/backrest:latest
    container_name: restic-backrest
    ports:
      - "9898:9898"
    environment:
      - BACKREST_PORT=9898
      - BACKREST_CONFIG=/config/config.json
      - BACKREST_DATA=/config/data
      - RESTIC_REPOSITORY=s3:http://minio:9000/playground
      - RESTIC_PASSWORD=playground-password
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
    volumes:
      - ./backrest_config:/config
      - ./data:/data:ro
    depends_on:
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  data-gen:
    image: alpine:latest
    container_name: restic-data-gen
    volumes:
      - ./data:/data
      - ./scripts/data-gen.sh:/usr/local/bin/data-gen.sh:ro
    command: ["/bin/sh", "/usr/local/bin/data-gen.sh"]
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: restic-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin) do echo 'Waiting for Minio...' && sleep 1; done;
      /usr/bin/mc mb local/playground || true;
      exit 0;
      "
